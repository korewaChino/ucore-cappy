# Mitigations with SMT left on, and the MDS family turned off.
#
# The previous value here was "mitigations=auto,nosmt=off", which the kernel
# rejects outright ("Unsupported mitigations=auto,nosmt=off, system may still be
# vulnerable") because nosmt=off is not a thing. The parameter was therefore
# ignored and the defaults applied, and the default for these CPUs is
# mds=auto -> full,nosmt, which offlines every sibling thread.
#
# These are separate parameters on purpose: mitigations= only accepts off,
# auto or nosmt.
#
#   mds=off               no VERW on kernel entry/exit
#   mmio_stale_data=off   same family, same cost, same trust assumption
#   l1tf=flush            L1D flush on VM entry; SMT stays enabled
#
# The MDS family is off deliberately: both exploit a cross-thread buffer that a
# process can only reach if it is already executing code on the box, and every
# workload here is trusted. The halved core count and the per-syscall VERW were
# being paid to defend against an attacker who has already won.
#
# L1TF stays mitigated because its threat model is different in one respect: a
# guest VM reading host memory. /dev/kvm is present on all three nodes and the
# image carries cloud-hypervisor, so the day a guest runs someone else's code
# is the day this flag matters. It costs nothing when no VM is entering.
kargs = ["mitigations=auto", "mds=off", "mmio_stale_data=off", "l1tf=flush"]
