# Kernel modules for running VMs on the node.
#
# vhost_net backs the tap+vhost-net datapath that cloud-hypervisor and qemu both
# use to get a guest NIC off the userspace path; without it guest networking
# falls back to userspace virtio-net, which is materially slower on these CPUs.
# It also provides /dev/vhost-net, which the VMM opens at guest start.
#
# vhost_vsock provides /dev/vhost-vsock, the host side of a vsock. A hypervisor
# driving guests over its own API wants vsock for the guest agent, because it
# needs no guest NIC to be up and no IP to be assigned first.
#
# Both are loadable modules on this kernel, so naming them here makes the
# devices exist before anything tries to open them.
vhost_net
vhost_vsock